name: SEO Report Daily

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate seo-report.json
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SERVICE_ACCOUNT_BASE64: ${{ secrets.GSC_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ] && [ -z "$GSC_SERVICE_ACCOUNT_BASE64" ]; then
            echo "Missing GSC_SERVICE_ACCOUNT_JSON or GSC_SERVICE_ACCOUNT_BASE64 secret"
            exit 1
          fi

          node scripts/generate-seo-report.js
          node -e 'const r=require("./astro/src/data/seo-report.json"); const age=Date.now()-Date.parse(r.generatedAt); if (!Number.isFinite(age) || age > 3600000) throw new Error("seo-report.json was not refreshed")'

      - name: Commit updated seo-report
        run: |
          if git diff --quiet -- astro/src/data/seo-report.json; then
            echo "No seo-report changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro/src/data/seo-report.json
          git commit -m "chore: update seo-report" \
            -m "修复或实现思路：定时拉取 GSC 数据并提交最新 seo-report.json"
          git push
