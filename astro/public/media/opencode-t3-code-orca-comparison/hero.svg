<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="background" x1="120" y1="60" x2="1510" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="0.52" stop-color="#17233B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="282" y1="712" x2="1316" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D6C6"/>
      <stop offset="0.48" stop-color="#7CA7FF"/>
      <stop offset="1" stop-color="#C69BFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#07101F" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <g opacity=".14" stroke="#A6C7FF">
    <path d="M0 100H1600M0 220H1600M0 340H1600M0 460H1600M0 580H1600M0 700H1600M0 820H1600"/>
    <path d="M80 0V900M240 0V900M400 0V900M560 0V900M720 0V900M880 0V900M1040 0V900M1200 0V900M1360 0V900M1520 0V900"/>
  </g>
  <circle cx="209" cy="188" r="242" fill="#277FA0" opacity=".12"/>
  <circle cx="1360" cy="696" r="285" fill="#7446B1" opacity=".14"/>

  <text x="120" y="132" fill="#DBEAFE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="5">AI CODING WORKFLOW</text>
  <text x="120" y="192" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700">执行 · 调度 · 隔离</text>
  <text x="120" y="238" fill="#A9BDD9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">三个层级，三种工具分工</text>

  <path d="M800 660C660 590 686 474 800 414C914 354 946 286 800 234" stroke="url(#line)" stroke-width="7" stroke-linecap="round" opacity=".9" filter="url(#glow)"/>
  <path d="M800 660C660 590 686 474 800 414C914 354 946 286 800 234" stroke="#EAF4FF" stroke-width="2" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="205" y="594" width="1190" height="184" rx="28" fill="#132D3B" stroke="#36D6C6" stroke-opacity=".72" stroke-width="2"/>
    <rect x="245" y="632" width="66" height="66" rx="18" fill="#1E8B89"/>
    <path d="M267 654L283 665L267 676M291 681H306" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="342" y="662" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700">执行层</text>
    <text x="342" y="705" fill="#B8DBE5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23">Agent、模型、工具调用与代码任务</text>
    <rect x="1114" y="638" width="228" height="58" rx="29" fill="#1F5256"/>
    <text x="1160" y="676" fill="#A7FBF4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">OpenCode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="365" width="1020" height="176" rx="28" fill="#1A2947" stroke="#7CA7FF" stroke-opacity=".82" stroke-width="2"/>
    <rect x="330" y="402" width="66" height="66" rx="18" fill="#5274C9"/>
    <rect x="347" y="419" width="32" height="8" rx="4" fill="white"/>
    <rect x="347" y="435" width="20" height="8" rx="4" fill="white"/>
    <rect x="347" y="451" width="28" height="8" rx="4" fill="white"/>
    <text x="426" y="431" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700">调度层</text>
    <text x="426" y="474" fill="#C5D5FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23">多个 Agent、线程、Git 操作与远程访问</text>
    <rect x="1052" y="407" width="205" height="58" rx="29" fill="#344F9D"/>
    <text x="1096" y="445" fill="#DCE8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">T3 Code</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="405" y="137" width="790" height="176" rx="28" fill="#302149" stroke="#C69BFF" stroke-opacity=".82" stroke-width="2"/>
    <rect x="445" y="174" width="66" height="66" rx="18" fill="#8862B8"/>
    <path d="M464 193H491V220H464zM470 199H485V214H470z" stroke="white" stroke-width="4" stroke-linejoin="round"/>
    <path d="M460 226H496" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="541" y="203" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700">隔离层</text>
    <text x="541" y="246" fill="#E1CEF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23">Worktree、分支、差异审查与合并</text>
    <rect x="944" y="179" width="198" height="58" rx="29" fill="#624386"/>
    <text x="994" y="217" fill="#F0E6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">Orca ADE</text>
  </g>

  <g fill="white" filter="url(#glow)">
    <circle cx="800" cy="660" r="10"/>
    <circle cx="800" cy="414" r="10"/>
    <circle cx="800" cy="234" r="10"/>
  </g>
</svg>
